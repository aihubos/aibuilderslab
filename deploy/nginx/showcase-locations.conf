# Paste the locations below into the existing server { } in
# /opt/aibuilderslab/nginx.conf. Do not replace the whole file.
#
# aibuilderslab-web also needs these read-only mounts:
#   /opt/aibl-showcase/uploads:/var/showcase/uploads:ro
#   /opt/aibl-showcase/media/samples:/var/showcase/media/samples:ro
#
# Quote every regex. An unquoted {16} makes `nginx -t` treat the brace as a block.
# Reload only after `nginx -t` succeeds. Range requests for mp4 stay enabled.

location /lounge/api/ {
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $showcase_upstream aibl-showcase-api:4331;
    rewrite ^/lounge/api/?(.*)$ /$1 break;
    proxy_pass http://$showcase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location ~* '^/lounge/uploads/([A-Za-z0-9_-]{16}/[A-Za-z0-9._-]+\.(?:jpe?g|png|gif|webp))$' {
    alias /var/showcase/uploads/$1;
    disable_symlinks on;
    autoindex off;
    default_type application/octet-stream;
    types {
        image/jpeg jpg jpeg;
        image/png png;
        image/gif gif;
        image/webp webp;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Robots-Tag noindex always;
    add_header Content-Disposition "inline" always;
}

location ~* '^/lounge/uploads/([A-Za-z0-9_-]{16}/[A-Za-z0-9._-]+\.(?:pdf|zip|pptx|docx|xlsx|txt|md))$' {
    alias /var/showcase/uploads/$1;
    disable_symlinks on;
    autoindex off;
    default_type application/octet-stream;
    types {
        application/pdf pdf;
        application/zip zip;
        application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
        text/plain txt md;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Robots-Tag noindex always;
    add_header Content-Disposition "attachment" always;
}

location ~* '^/lounge/media/samples/([A-Za-z0-9._-]+\.mp4)$' {
    alias /var/showcase/media/samples/$1;
    disable_symlinks on;
    autoindex off;
    default_type video/mp4;
    types {
        video/mp4 mp4;
    }
    expires 30d;
    add_header X-Content-Type-Options nosniff always;
}
